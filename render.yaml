services:
  - type: web
    name: work-schedule
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn work_schedule.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: work-schedule-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: work-schedule.onrender.com